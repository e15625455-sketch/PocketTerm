[workspace]
resolver = "3"
members = [
  "crates/pocketterm-core",
  "crates/pocketterm-server",
  "crates/pocketterm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"
