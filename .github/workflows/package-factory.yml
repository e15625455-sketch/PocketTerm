name: PocketTerm package factory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: pocketterm-package-factory
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout PocketTerm
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xz-utils
          docker version
      - name: Checkout current Termux package recipes
        run: git clone --depth 1 https://github.com/termux/termux-packages.git "$RUNNER_TEMP/termux-packages"

      - name: Configure the PocketTerm package prefix
        run: factory/configure-termux.sh "$RUNNER_TEMP/termux-packages"

      - name: Build Python and its dependency closure for aarch64
        working-directory: ${{ runner.temp }}/termux-packages
        run: ./scripts/run-docker.sh ./build-package.sh -F -a aarch64 -o output python

      - name: Generate Packages, Release, source and license manifests
        env:
          PT_SIGNING_KEY: ${{ secrets.PT_SIGNING_KEY }}
        run: |
          set +x
          set -euo pipefail
          umask 077

          if [ -n "$PT_SIGNING_KEY" ]; then
            :
          else
            echo "secret PT_SIGNING_KEY vazio ou indisponível" >&2
            exit 1
          fi

          key_file="$RUNNER_TEMP/pt-sign.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$PT_SIGNING_KEY" > "$key_file"
          unset PT_SIGNING_KEY
          chmod 600 "$key_file"

          if [ ! -s "$key_file" ]; then
            echo "secret PT_SIGNING_KEY vazio ou indisponível" >&2
            exit 1
          fi

          echo "Validating Ed25519 private key..."
          openssl pkey -in "$key_file" -noout
          echo "Ed25519 private key parsed successfully."

          mkdir -p "$RUNNER_TEMP/pocketterm-site"
          factory/create-repository.sh \
            "$RUNNER_TEMP/termux-packages/output" \
            "$RUNNER_TEMP/pocketterm-site" \
            "$RUNNER_TEMP/termux-packages" \
            "$key_file"

      - name: Upload repository artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: pocketterm-aarch64-apt-repository
          path: ${{ runner.temp }}/pocketterm-site
          if-no-files-found: error
          retention-days: 14

      - name: Checkout public package repository
        uses: actions/checkout@v4
        with:
          repository: e15625455-sketch/PocketTerm-pkg
          ref: main
          token: ${{ secrets.PT_PUBLISH_TOKEN }}
          path: package-store
          persist-credentials: true

      - name: Publish the signed repository to gh-pages
        run: factory/publish-site.sh "$RUNNER_TEMP/pocketterm-site" "$GITHUB_WORKSPACE/package-store"
